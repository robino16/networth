[project]
name = "backend"
version = "0.1.0"
description = "Networth backend"
readme = "README.md"
authors = [
    { name = "robino16", email = "50367979+robino16@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.138.2",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
]
